<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registo · ConcelhoSesimbra</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Imagens/logo.png">
  <link href="./componentes/login-registro/global.css" rel="stylesheet">
  <link href="./componentes/login-registro/registro.css" rel="stylesheet">
</head>

<body>

  <!-- ── Google Translate (motor escondido) ───────────────────── -->
  <div id="google_translate_element" class="gtranslate-hidden"></div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'pt', includedLanguages: 'pt,en,es,fr,de,it,zh-CN,ja,ko,th,ru,sv,tr,no,pl,fi,uk', layout: google.translate.TranslateElement.InlineLayout.SIMPLE },
        'google_translate_element'
      );
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>

  <!-- ── Seletor de idioma (visual próprio) ───────────────────── -->
  <div class="lang-switch">
    <button class="lang-switch__btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="10" cy="10" r="7.5"/>
        <path d="M2.5 10h15M10 2.5c2.2 2 3.4 4.8 3.4 7.5s-1.2 5.5-3.4 7.5c-2.2-2-3.4-4.8-3.4-7.5S7.8 4.5 10 2.5Z"/>
      </svg>
      <span id="langLabel">PT</span>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" class="lang-switch__caret">
        <path d="M5 7.5 10 12.5 15 7.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="lang-switch__menu" id="langMenu">
      <button type="button" class="lang-switch__item" data-lang="pt">Português</button>
      <button type="button" class="lang-switch__item" data-lang="en">Inglês</button>
      <button type="button" class="lang-switch__item" data-lang="es">Espanhol</button>
      <button type="button" class="lang-switch__item" data-lang="fr">Francês</button>
      <button type="button" class="lang-switch__item" data-lang="de">Alemão</button>
      <button type="button" class="lang-switch__item" data-lang="it">Italiano</button>
      <button type="button" class="lang-switch__item" data-lang="zh-CN">Chinês</button>
      <button type="button" class="lang-switch__item" data-lang="ja">Japonês</button>
      <button type="button" class="lang-switch__item" data-lang="ko">Coreano</button>
      <button type="button" class="lang-switch__item" data-lang="th">Tailandês</button>
      <button type="button" class="lang-switch__item" data-lang="ru">Russo</button>
      <button type="button" class="lang-switch__item" data-lang="sv">Sueco</button>
      <button type="button" class="lang-switch__item" data-lang="tr">Turco</button>
      <button type="button" class="lang-switch__item" data-lang="no">Norueguês</button>
      <button type="button" class="lang-switch__item" data-lang="pl">Polaco</button>
      <button type="button" class="lang-switch__item" data-lang="fi">Finlandês</button>
      <button type="button" class="lang-switch__item" data-lang="uk">Ucraniano</button>
    </div>
  </div>

  <div class="visual-login">
    <a href="#" class="visual-logo">Concelho<span>Sesimbra</span></a>

    <div class="visual-body">
      <div class="visual-tag">
        <span class="visual-tag__dot"></span>
        Plataforma Turística
      </div>

      <h1 class="visual-titulo">
        Entre a serra<br>e o <em>mar azul</em>
      </h1>

      <p class="visual-sub">
        Descobre rotas históricas, pontos de interesse e
        paisagens únicas do Concelho de Sesimbra.
      </p>
    </div>
  </div>

  <div class="login-painel">

    <header class="painel-header">
      <span class="eyebrow">Área Pessoal</span>
      <h2 class="painel-titulo">Cria a tua<br>conta</h2>
      <p class="painel-sub">
        Já tens conta?
        <a href="login.html" class="link">Entra aqui</a>
      </p>
    </header>

    <div class="steps-indicator">
      <div class="step-circle is-active" data-step-circle="1">1</div>
      <div class="step-line"></div>
      <div class="step-circle" data-step-circle="2">2</div>
    </div>

    <div class="error-msg" id="registro-erro">
      <span id="registro-erro-texto">Erro</span>
    </div>

    <div class="form-stack form-step is-active" data-step="1">

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <div class="field__wrap">
          <svg class="field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h12a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5v-9Z"/>
            <path d="m2.5 5.5 7.5 5 7.5-5"/>
          </svg>
          <input class="field__input" type="email" id="email" placeholder="o.teu@email.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="password">Senha</label>
        <div class="field__wrap">
          <svg class="field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="9" width="14" height="9" rx="1.5"/>
            <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9"/>
          </svg>
          <input class="field__input field__input--toggle" type="password" id="password" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="field__toggle" data-toggle="password" aria-label="Mostrar senha">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M4 4l16 16"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="confirmPassword">Confirmar senha</label>
        <div class="field__wrap">
          <svg class="field__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="9" width="14" height="9" rx="1.5"/>
            <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9"/>
          </svg>
          <input class="field__input field__input--toggle" type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="field__toggle" data-toggle="confirmPassword" aria-label="Mostrar senha">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M4 4l16 16"/>
            </svg>
          </button>
        </div>
      </div>

    </div>

    <div class="form-stack form-step" data-step="2">

      <div class="field">
        <label class="field__label" for="primeiroNome">Primeiro nome</label>
        <div class="field__wrap">
          <input class="field__input field__input--no-icon" type="text" id="primeiroNome" placeholder="Maria" autocomplete="given-name">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="ultimoNome">Último nome</label>
        <div class="field__wrap">
          <input class="field__input field__input--no-icon" type="text" id="ultimoNome" placeholder="Silva" autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="dataNascimento">Data de nascimento</label>
        <div class="field__wrap">
          <input class="field__input field__input--no-icon" type="date" id="dataNascimento" autocomplete="bday">
        </div>
      </div>

    </div>

    <div class="painel-actions">
      <div class="step-buttons">
        <button class="btn btn--ghost" id="btnVoltar" type="button" style="display:none;">Voltar</button>
        <button class="btn btn--primary" id="btnAvancar" type="button">
          Continuar
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" class="btn__arrow">
            <path d="M4 10h12M12 6l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script type="module" src="./componentes/login-registro/registro.js"></script>
</body>
</html>

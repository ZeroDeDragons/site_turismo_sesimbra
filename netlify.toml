[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  command = "npm run dev"
  port = 8888
  targetPort = 3000
  publish = "dist"

# 1º As funções/API (Regra mais específica primeiro!)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2º O Frontend (Regra geral em último)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200